name: Godot headless tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      usi_soak_plies:
        description: "実機USI耐性テストの手数（1〜80、既定8）"
        required: false
        default: "8"
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Godot ${{ matrix.godot }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        godot: [4.7.1]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot
        shell: bash
        run: |
          set -euo pipefail
          version="${{ matrix.godot }}"
          archive="Godot_v${version}-stable_linux.x86_64.zip"
          url="https://github.com/godotengine/godot/releases/download/${version}-stable/${archive}"
          curl --fail --location --retry 3 --retry-all-errors --output "${archive}" "${url}"
          unzip -q "${archive}"
          binary="Godot_v${version}-stable_linux.x86_64"
          chmod +x "${binary}"
          mv "${binary}" "${RUNNER_TEMP}/godot"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/godot" --version

      - name: Build fixed real USI engine
        shell: bash
        run: |
          set -euo pipefail
          apery_commit="8e64bc427bff033a38f1b60b9013ad2d62f88db7"
          engine_dir="${RUNNER_TEMP}/apery_rust"
          git clone --filter=blob:none https://github.com/HiraokaTakuya/apery_rust.git "${engine_dir}"
          git -C "${engine_dir}" checkout --detach "${apery_commit}"
          cargo build --manifest-path "${engine_dir}/Cargo.toml" --release --locked --no-default-features --features material
          engine_path="${engine_dir}/target/release/apery"
          test -x "${engine_path}"
          echo "USI_ENGINE_PATH=${engine_path}" >> "${GITHUB_ENV}"
          echo "USI_ENGINE_REQUIRED=1" >> "${GITHUB_ENV}"

      - name: Run headless test suite
        id: test
        shell: bash
        env:
          USI_DIAGNOSTICS_DIR: ${{ runner.temp }}/usi-diagnostics
          USI_SOAK_PLIES: ${{ github.event.inputs.usi_soak_plies || '8' }}
        run: |
          set -o pipefail
          ./tests/run.sh 2>&1 | tee godot-test.log

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: godot-test-log-${{ matrix.godot }}
          path: godot-test.log
          if-no-files-found: warn
      - name: Upload USI diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: usi-failure-diagnostics-${{ matrix.godot }}
          path: ${{ runner.temp }}/usi-diagnostics
          if-no-files-found: warn
